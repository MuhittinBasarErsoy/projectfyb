<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FyBlue</title>
    <base href="/" />
    <meta name="color-scheme" content="light dark" />
    <script>
        // Tema, ilk boyamadan önce uygulanır (yanıp sönme olmasın).
        (function () {
            try {
                var t = localStorage.getItem('fyblue.theme');
                if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css?v=2026-09-25" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <span class="brand-mark boot-mark">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z" /></svg>
            </span>
            <div class="boot-bar"><span class="boot-progress"></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Beklenmeyen bir hata oluştu.
        <a href="." class="reload">Yeniden yükle</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="js/app.js?v=2026-09-25"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
